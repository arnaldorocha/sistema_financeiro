<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avisos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>Avisos de Hoje</h1>
        {% if avisos %}
        <ul class="list-group">
            {% for aviso in avisos %}
            <li class="list-group-item">
                <strong>Transação:</strong> {{ aviso.nome }} <br>
                <strong>Data:</strong> {{ aviso.data }}
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div class="alert alert-info">Nenhum aviso para hoje.</div>
        {% endif %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-4">Voltar ao Dashboard</a>
    </div>
    
    <script>
            
        document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            events: '/api/transacoes'
        });
        calendar.render();
    });

    </script>
    
</body>
</html>
