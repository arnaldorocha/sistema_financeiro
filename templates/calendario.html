<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Notificações</title>
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #calendar { max-width: 900px; margin: 0 auto; }
    .filter-controls { margin: 1rem auto; max-width: 900px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Calendário de Notificações</h1>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mb-3">&larr; Voltar ao Dashboard</a>
    
    <!-- Filtros de Período e Pesquisa -->
    <div class="filter-controls mb-3">
      <div class="row g-2">
        <div class="col-md-4">
          <input type="text" id="searchEvent" class="form-control" placeholder="Pesquisar por nome...">
        </div>
        <div class="col-md-8">
          <div class="btn-group" role="group">
            <button class="btn btn-outline-primary filter-btn" data-period="diario">Diário</button>
            <button class="btn btn-outline-primary filter-btn" data-period="semanal">Semanal</button>
            <button class="btn btn-outline-primary filter-btn" data-period="mensal">Mensal</button>
            <button class="btn btn-outline-primary filter-btn" data-period="anual">Anual</button>
            <button class="btn btn-outline-secondary filter-btn" data-period="">Todos</button>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Calendário -->
    <div id="calendar"></div>
    
    <!-- Área para Relatório e Gráficos -->
    <div class="mt-4">
      <h2 class="text-center">Relatório e Gráficos</h2>
      <canvas id="calendarioChart"></canvas>
    </div>
  </div>

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        events: {{ eventos | tojson }}, // Eventos enviados pelo backend
        eventClick: function(info) {
          alert('Título: ' + info.event.title + '\nDescrição: ' + info.event.extendedProps.description);
        }
      });
      calendar.render();
      
      // Filtro por período
      document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const period = this.getAttribute('data-period');
          window.location.href = '{{ url_for("calendario_view") }}' + (period ? '?periodo=' + period : '');
        });
      });
      
      // Filtro por nome
      document.getElementById('searchEvent').addEventListener('keyup', function() {
        const searchTerm = this.value.toLowerCase();
        calendar.getEvents().forEach(function(event) {
          event.setProp('display', event.title.toLowerCase().includes(searchTerm) ? 'auto' : 'none');
        });
      });
      
      // Exemplo de gráfico com Chart.js para o relatório
      const ctx = document.getElementById('calendarioChart').getContext('2d');
      const reportChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: {{ relatorio_datas | tojson }}, // Datas ou períodos
          datasets: [{
            label: 'Total de Gastos',
            data: {{ relatorio_gastos | tojson }},  // Valores agregados
            borderColor: '#e74a3b',
            fill: false,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) { return 'R$ ' + value; }
              }
            }
          }
        }
      });
    });
  </script>
</body>
