<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Transação</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .hidden { display: none !important; }
  </style>
</head>

<body class="bg-light">



  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/dashboard">
        <i class="fa-solid fa-piggy-bank me-2"></i> Controle Financeiro
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item">
            <a class="nav-link text-white" href="{{ url_for('calendario') }}">
              <i class="fa-solid fa-chart-pie"></i> Calendário
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link text-white" href="{{ url_for('contas') }}">
              <i class="fa-solid fa-file-invoice-dollar"></i> Contas
            </a>
          </li>

          <li class="nav-item mt-2 mt-lg-0">
            <a href="/transacoes" class="btn btn-light text-primary fw-bold w-100">
              <i class="fa-solid fa-list"></i> Transações
            </a>
          </li>

        </ul>
      </div>
    </div>
  </nav>


<div class="container mt-5">

  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0"><i class="fa-solid fa-pen-to-square"></i> Editar Transação</h3>
    </div>

    <div class="card-body">

      <form action="{{ url_for('editar_transacao', id=transacao['id']) }}" method="post">

        <!-- Tipo -->
        <div class="mb-3">
          <label class="form-label">Tipo de Transação</label>
          <select class="form-select" id="tipo" name="tipo" required>
            <option value="gasto" {% if transacao['tipo'] == 'gasto' %}selected{% endif %}>Gasto</option>
            <option value="renda" {% if transacao['tipo'] == 'renda' %}selected{% endif %}>Renda</option>
          </select>
        </div>

        <!-- Nome -->
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" name="nome" value="{{ transacao['nome'] }}" required>
        </div>

        <!-- Valor -->
        <div class="mb-3">
          <label class="form-label">Valor</label>
          <input type="number" step="0.01" class="form-control" name="valor" value="{{ transacao['valor'] }}" required>
        </div>

        <!-- Categoria -->
        <div class="mb-3">
          <label class="form-label">Categoria</label>
          <select class="form-select" id="categoria" name="categoria" required>
            <option value="necessidades" {% if transacao['categoria']=='necessidades' %}selected{% endif %}>Necessidades</option>
            <option value="lazer" {% if transacao['categoria']=='lazer' %}selected{% endif %}>Lazer</option>
            <option value="investimento" {% if transacao['categoria']=='investimento' %}selected{% endif %}>Investimento</option>
            <option value="reserva" {% if transacao['categoria']=='reserva' %}selected{% endif %}>Reserva</option>
            <option value="causas_sociais" {% if transacao['categoria']=='causas_sociais' %}selected{% endif %}>Causa Social</option>

          </select>
        </div>

        <!-- Período (somente gasto) -->
        <div id="periodo-grupo" class="mb-3">
          <label class="form-label">Período</label>
          <select class="form-select" id="periodo" name="periodo">
            <option value="" disabled>Selecione...</option>
            <option value="diario" {% if transacao['periodo']=='diario' %}selected{% endif %}>Diário</option>
            <option value="semanal" {% if transacao['periodo']=='semanal' %}selected{% endif %}>Semanal</option>
            <option value="mensal" {% if transacao['periodo']=='mensal' %}selected{% endif %}>Mensal</option>
            <option value="anual" {% if transacao['periodo']=='anual' %}selected{% endif %}>Anual</option>
          </select>
        </div>

        <!-- Data -->
        <div class="mb-3">
          <label class="form-label">Data</label>
          <input type="date" class="form-control" name="data" value="{{ transacao['data'] }}" required>
        </div>

        <button class="btn btn-primary w-100">
          <i class="fa-solid fa-save"></i> Atualizar
        </button>

      </form>

    </div>
  </div>

</div>

<script>
  const tipo = document.getElementById("tipo");
  const periodoGrupo = document.getElementById("periodo-grupo");
  const campoPeriodo = document.getElementById("periodo");

  function atualizarVisibilidade() {
    if (tipo.value === "renda") {
      periodoGrupo.classList.add("hidden");
      campoPeriodo.required = false;
    } else {
      periodoGrupo.classList.remove("hidden");
      campoPeriodo.required = true;
    }
  }

  tipo.addEventListener("change", atualizarVisibilidade);

  // Executar ao carregar a página
  atualizarVisibilidade();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
