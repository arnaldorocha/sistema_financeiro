<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações</title>
</head>
<body>
    <h1>Notificações</h1>
    <a href="{{ url_for('dashboard') }}">Voltar ao Dashboard</a>
    <ul>
        {% for notificacao in notificacoes %}
        <li>
            <strong>{{ notificacao['data_criacao'] }}</strong><br>
            {{ notificacao['mensagem'] }}
            <form action="{{ url_for('marcar_como_lida', notificacao_id=notificacao['id']) }}" method="POST" style="display: inline;">
                <button type="submit">Marcar como lida</button>
            </form>
        </li>
        {% else %}
        <li>Sem notificações no momento.</li>
        {% endfor %}
    </ul>
</body>
</html>
