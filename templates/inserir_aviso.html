<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserir Aviso - Contas a Pagar e Receber</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Inserir Aviso - Contas a Pagar e a Receber</h2>
    <form action="/salvar_aviso" method="post">
        <label for="tipo">Tipo de Conta:</label>
        <select id="tipo" name="tipo" required>
            <option value="pagar">Conta a Pagar</option>
            <option value="receber">Conta a Receber</option>
        </select>

        <label for="nome">Nome do Devedor/Recebedor:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="descricao">Descrição da Conta:</label>
        <input type="text" id="descricao" name="descricao" required>

        <label for="valor">Valor (R$):</label>
        <input type="number" step="0.01" id="valor" name="valor" required>

        <label for="data">Data de Vencimento/Pagamento:</label>
        <input type="date" id="data" name="data" required>

        <button type="submit">Salvar Aviso</button>
    </form>
</div>

</body>
</html>
