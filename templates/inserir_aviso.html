<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserir Aviso</title>
</head>
<body>
    <h2>Inserir Novo Aviso</h2>
    <form action="{{ url_for('inserir_aviso') }}" method="POST">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" required></textarea><br><br>
        
        <label for="data_envio">Data de Envio:</label>
        <input type="datetime-local" id="data_envio" name="data_envio" required><br><br>

        <label for="destinatario">Destinatário:</label>
        <input type="text" id="destinatario" name="destinatario" required><br><br>

        <button type="submit">Enviar Aviso</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Voltar</a>
</body>
</html>
