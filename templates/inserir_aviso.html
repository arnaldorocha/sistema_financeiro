{% extends "base.html" %}

{% block title %}Inserir Aviso{% endblock %}

{% block content %}
<div class="container py-5">
  <form action="{{ url_for('inserir_aviso') }}" method="POST">

    <div class="mb-3">
      <label for="tipo" class="form-label">Tipo de Aviso</label>
      <select class="form-select" id="tipo" name="tipo" required>
        <option value="" disabled selected>Selecione...</option>
        <option value="pagar">Conta a Pagar</option>
        <option value="receber">Conta a Receber</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" class="form-control" name="nome" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Valor</label>
      <input type="number" step="0.01" class="form-control" name="valor" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Categoria</label>
      <select class="form-select" id="categoria" name="categoria" required>
        <option value="" disabled selected>Selecione...</option>

        <option value="necessidades" class="pagar">Necessidades</option>
        <option value="lazer" class="pagar">Lazer</option>
        <option value="investimento" class="pagar">Investimento</option>
        <option value="reserva" class="pagar">Reserva</option>
        <option value="causas_sociais" class="pagar">Causa Social</option>

        <option value="renda" class="receber">Renda</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Data</label>
      <input type="date" class="form-control" name="data" required>
    </div>

    <button class="btn btn-primary w-100">Inserir Aviso</button>

  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const tipoSelect = document.getElementById('tipo');
const categoriaSelect = document.getElementById('categoria');

function atualizarCategorias() {
  const tipo = tipoSelect.value;
  const options = categoriaSelect.querySelectorAll('option');

  options.forEach(opt => {
    if (opt.classList.contains(tipo) || opt.value === "") {
      opt.hidden = false;
    } else {
      opt.hidden = true;
    }
  });

  categoriaSelect.value = "";
}

tipoSelect.addEventListener('change', atualizarCategorias);
</script>
{% endblock %}
