<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Aviso - Contas a Pagar/Receber</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="/dashboard">
        <i class="fa-solid fa-piggy-bank me-2"></i> Controle Financeiro
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link text-white" href="{{ url_for('calendario') }}">
              <i class="fa-solid fa-chart-pie"></i> Calendário
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="{{ url_for('contas') }}">
              <i class="fa-solid fa-file-invoice-dollar"></i> Contas
            </a>
          </li>
          <li class="nav-item mt-2 mt-lg-0">
            <a href="/transacoes" class="btn btn-light text-primary fw-bold w-100">
              <i class="fa-solid fa-list"></i> Transações
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="container py-5">

    <form action="{{ url_for('editar_aviso', id=aviso.id) }}" method="POST">
      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de Aviso</label>
        <select class="form-select" id="tipo" name="tipo" required>
          <option value="pagar" {% if aviso.tipo == 'pagar' %}selected{% endif %}>Conta a Pagar</option>
          <option value="receber" {% if aviso.tipo == 'receber' %}selected{% endif %}>Conta a Receber</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" value="{{ aviso.nome }}" required>
      </div>

      <div class="mb-3">
        <label for="valor" class="form-label">Valor (R$)</label>
        <input type="number" step="0.01" class="form-control" id="valor" name="valor" value="{{ aviso.valor }}" required>
      </div>

      <div class="mb-3">
        <label for="data" class="form-label">Data de Vencimento</label>
        <input type="date" class="form-control" id="data" name="data" value="{{ aviso.data }}" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="fa-solid fa-check"></i> Salvar Alterações
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
