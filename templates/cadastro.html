{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block head %}

<style>

body{
    background:#0b0f1a;
}

.auth-container{
    display:flex;
    min-height:100vh;
}

.auth-left{
    width:50%;
    background:#05070d;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:60px;
}

.auth-left h1{
    font-size:42px;
    margin-bottom:25px;
}

.auth-left input{

    background:#0f1424;
    border:1px solid #2a2f45;
    border-radius:12px;
    padding:14px;
    color:white;
    margin-bottom:15px;

}

.auth-btn{

    margin-top:15px;

    border:none;
    border-radius:12px;
    padding:14px;

    background:linear-gradient(
        90deg,
        #7c3aed,
        #ec4899,
        #f59e0b
    );

    color:white;
}

.auth-right{

    width:50%;

    background:url("{{ url_for('static', filename='img/bg.jpg') }}");

    background-size:cover;
    background-position:center;
    position:relative;

}

.auth-right::before{

    content:"";
    position:absolute;
    inset:0;

    background:

    linear-gradient(
        to right,
        rgba(5,7,13,0.9),
        rgba(5,7,13,0.3)
    ),

    linear-gradient(
        to bottom,
        rgba(5,7,13,0.7),
        rgba(5,7,13,0.2)
    );

}

@media(max-width:900px){

.auth-right{
    display:none;
}

.auth-left{
    width:100%;
}

}

</style>

{% endblock %}


{% block content %}

<div class="auth-container">

<div class="auth-left">

<h1>Criar conta</h1>

<form method="POST" action="{{ url_for('cadastro') }}">

<input name="username"
       placeholder="Usuário"
       class="form-control"
       required>

<input name="password"
       type="password"
       placeholder="Senha"
       class="form-control"
       required>

<button class="auth-btn w-100">
Criar acesso
</button>

</form>

</div>

<div class="auth-right"></div>

</div>

{% endblock %}
