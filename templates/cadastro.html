<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <!-- Custom CSS (opcional) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f4f9;
    }
    .form-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .form-container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    .form-container .form-label {
      font-weight: bold;
    }
    .btn-custom {
      background-color: #1A73E8;
      color: white;
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    

    .btn-custom:hover {
      background-color: #0C58D6;
      color: white;
    }

    .link-text {
      text-align: center;
      margin-top: 15px;
    }
    .flash-message {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Tela de Cadastro -->
  <div class="container my-5">
    <div class="form-container">
      <h2>Cadastro de Usuário</h2>
      <form method="post" action="{{ url_for('cadastro') }}" class="forms_login">
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input type="text" class="form-control" name="username" id="username" placeholder="Insira seu usuário" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input type="password" class="form-control" name="password" id="password" placeholder="Insira sua senha" required>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar Senha</label>
          <input type="password" class="form-control" name="confirmPassword" id="confirmPassword" placeholder="Confirme sua senha" required>
        </div>
        

        <button type="submit" class="btn btn-custom">Criar Acesso</button>
      </form>
      <div class="link-text">
        <a href="{{ url_for('index') }}">Voltar à Tela de Login</a>
      </div>
    </div>
  </div>

  <!-- Flash Messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages-container">
        {% for message, category in messages %}
          <div class="flash-message {{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}


  <!-- Script para fechar mensagens flash -->
  <script>
    setTimeout(function() {
      var flashMessages = document.getElementsByClassName('flash-message');
      for (var i = 0; i < flashMessages.length; i++) {
        flashMessages[i].style.display = 'none';
      }
    }, 6000);
  </script>
</body>
</html>
