<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dicas para Utilizar Seu Dinheiro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Barra de Navegação -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
      <a class="navbar-brand" href="/dashboard">Controle Financeiro</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/transacoes">Transações</a></li>
          <li class="nav-item"><a class="nav-link" href="/contas">Contas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h1 class="mb-4">Dicas para Utilizar Seu Dinheiro</h1>
    <div class="row">
      {% for chave, mensagem in orientacoes.items() %}
      <div class="col-md-6 mb-3">
        <div class="card border-primary">
          <div class="card-header bg-primary text-white">
            {{ chave.replace('_', ' ').capitalize() }}
          </div>
          <div class="card-body">
            <p class="card-text">{{ mensagem }}</p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    <div class="mt-4">
      <a href="/dashboard" class="btn btn-secondary">Voltar ao Dashboard</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
