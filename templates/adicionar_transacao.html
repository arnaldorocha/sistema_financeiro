<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adicionar Transação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .hidden { display: none !important; }
  </style>
</head>

<body class="bg-light">

  <!-- Container -->
  <div class="container mt-5">

    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h3 class="mb-0"><i class="fa-solid fa-plus"></i> Adicionar Transação</h3>
      </div>

      <div class="card-body">

        <form action="{{ url_for('adicionar_transacao') }}" method="post">

          <!-- Tipo -->
          <div class="mb-3">
            <label class="form-label">Tipo de Transação</label>
            <select class="form-select" id="tipo" name="tipo" required>
              <option value="" disabled selected>Selecione...</option>
              <option value="gasto">Gasto</option>
              <option value="renda">Renda</option>
            </select>
          </div>

          <!-- Nome -->
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" required>
          </div>

          <!-- Valor -->
          <div class="mb-3">
            <label class="form-label">Valor</label>
            <input type="number" step="0.01" class="form-control" name="valor" required>
          </div>

          <!-- Área escondida quando for RENDA -->
          <div id="grupo-opcoes">

            <!-- Período -->
            <div class="mb-3">
              <label class="form-label">Período</label>
              <select class="form-select" id="periodo" name="periodo">
                <option value="" disabled selected>Selecione...</option>
                <option value="diario">Diário</option>
                <option value="semanal">Semanal</option>
                <option value="mensal">Mensal</option>
                <option value="anual">Anual</option>
              </select>
            </div>

            <!-- Categoria -->
            <div class="mb-3">
              <label class="form-label">Categoria</label>
              <select class="form-select" id="categoria" name="categoria">
                <option value="" disabled selected>Selecione...</option>
                <option value="necessidades">Necessidades</option>
                <option value="lazer">Lazer</option>
                <option value="investimento">Investimento</option>
                <option value="reserva">Reserva</option>
                <option value="causas_sociais">Causa Social</option>
              </select>
            </div>

          </div>

          <!-- Data -->
          <div class="mb-3">
            <label class="form-label">Data</label>
            <input type="date" class="form-control" name="data" required>
          </div>

          <!-- Botão -->
          <button class="btn btn-primary w-100">
            <i class="fa-solid fa-check"></i> Adicionar Transação
          </button>

        </form>
      </div>
    </div>

  </div>

  <script>
    const tipo = document.getElementById("tipo");
    const grupo = document.getElementById("grupo-opcoes");
    const campoPeriodo = document.getElementById("periodo");
    const campoCategoria = document.getElementById("categoria");

    tipo.addEventListener("change", function () {

      if (this.value === "renda") {
        grupo.classList.add("hidden");
        campoPeriodo.required = false;
        campoCategoria.required = false;

      } else {
        grupo.classList.remove("hidden");
        campoPeriodo.required = true;
        campoCategoria.required = true;
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
