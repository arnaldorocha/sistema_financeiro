{% extends 'base.html' %}

{% block title %}Adicionar Transação{% endblock %}

{% block head %}
<style>
  .hidden {
    display: none !important;
  }

  .card {
    border-radius: 14px;
  }

  .card-header {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .form-label {
    font-weight: 600;
  }

  .btn-primary {
    font-weight: 600;
    padding: 10px;
  }
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">
      <i class="fa-solid fa-plus"></i> Adicionar Transação
    </div>

    <div class="card-body">

      <form action="{{ url_for('adicionar_transacao') }}" method="post">

        <!-- Tipo -->
        <div class="mb-3">
          <label class="form-label">Tipo de Transação</label>
          <select class="form-select" id="tipo" name="tipo" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="gasto">Gasto</option>
            <option value="renda">Renda</option>
          </select>
        </div>

        <!-- Nome -->
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" name="nome" required>
        </div>

        <!-- Valor -->
        <div class="mb-3">
          <label class="form-label">Valor</label>
          <input type="number" step="0.01" class="form-control" name="valor" required>
        </div>

        <!-- Categoria -->
        <div class="mb-3">
          <label class="form-label">Categoria</label>
          <select class="form-select" id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="auto">Auto (classificação automática)</option>
            <option value="necessidades">Necessidades</option>
            <option value="lazer">Lazer</option>
            <option value="investimento">Investimento</option>
            <option value="reserva">Reserva</option>
            <option value="causas_sociais">Causa Social</option>
            <option value="renda">Renda</option>
          </select>
          <div class="form-text">
            Escolha "Auto" para usar categorias inteligentes.
          </div>
        </div>

        <!-- Período -->
        <div id="periodo-grupo" class="mb-3 hidden">
          <label class="form-label">Período</label>
          <select class="form-select" id="periodo" name="periodo">
            <option value="" disabled selected>Selecione...</option>
            <option value="diario">Diário</option>
            <option value="semanal">Semanal</option>
            <option value="mensal">Mensal</option>
            <option value="anual">Anual</option>
          </select>
        </div>

        <!-- Data -->
        <div class="mb-3">
          <label class="form-label">Data</label>
          <input type="date" class="form-control" name="data" value="{{ hoje }}" required>
        </div>

        <button class="btn btn-primary w-100">
          <i class="fa-solid fa-check"></i> Adicionar Transação
        </button>

      </form>

    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {

  const tipo = document.getElementById("tipo");
  const periodoGrupo = document.getElementById("periodo-grupo");
  const campoPeriodo = document.getElementById("periodo");

  tipo.addEventListener("change", function() {
    if (this.value === "renda") {
      periodoGrupo.classList.add("hidden");
      campoPeriodo.required = false;
      campoPeriodo.value = "";
    } else {
      periodoGrupo.classList.remove("hidden");
      campoPeriodo.required = true;
    }
  });

});
</script>
{% endblock %}
